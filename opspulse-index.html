<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OpsPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  :root {
    --bg:#0e1116; --surface:#161b22; --surface-2:#1c2430; --line:#273140;
    --text:#e6edf3; --text-dim:#8b97a7; --text-faint:#5c6675;
    --accent:#4b9fff; --accent-dim:#2a4d73;
    --sev-critical:#ff5c5c; --sev-high:#ff9f43; --sev-medium:#ffd34e; --sev-low:#6ab0ff;
    --st-open:#ff9f43; --st-progress:#4b9fff; --st-resolved:#46c88a;
    --radius:8px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:Inter,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; }

  #login-view { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:100%; max-width:380px; }
  .brand { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .brand-mark { width:11px; height:11px; border-radius:50%; background:var(--st-resolved); box-shadow:0 0 0 4px rgba(70,200,138,.15); position:relative; top:-1px; }
  .brand-name { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .login-sub { color:var(--text-dim); margin:0 0 32px 21px; font-size:14px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:13px; font-weight:500; color:var(--text-dim); margin-bottom:7px; }
  .field input {
    width:100%; padding:11px 13px; background:var(--surface); color:var(--text);
    border:1px solid var(--line); border-radius:var(--radius); font-size:15px;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(75,159,255,.15); }
  .btn-primary {
    width:100%; padding:12px; background:var(--accent); color:#06121f; border:none;
    border-radius:var(--radius); font-size:15px; font-weight:600; transition:filter .15s;
  }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-primary:disabled { opacity:.5; cursor:default; }
  .login-error, .form-error { color:var(--sev-critical); font-size:13px; margin-top:14px; min-height:18px; }

  #app-view { display:none; min-height:100%; flex-direction:column; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
  }
  .topbar .brand-name { font-size:19px; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .who { text-align:right; line-height:1.25; }
  .who .who-name { font-size:13px; font-weight:500; }
  .who .who-tenant { font-size:12px; color:var(--text-faint); }
  .live-dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-faint); }
  .live-dot .dot { width:7px; height:7px; border-radius:50%; background:var(--text-faint); transition:background .2s; }
  .live-dot.on .dot { background:var(--st-resolved); box-shadow:0 0 0 3px rgba(70,200,138,.18); }
  .live-dot.on { color:var(--st-resolved); }
  .btn-ghost {
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
    border-radius:6px; padding:7px 13px; font-size:13px; font-weight:500;
    transition:color .15s, border-color .15s;
  }
  .btn-ghost:hover { color:var(--text); border-color:var(--text-faint); }

  .layout { flex:1; display:grid; grid-template-columns:340px 1fr; min-height:0; }
  @media (max-width:820px) {
    .layout { grid-template-columns:1fr; }
    .compose { border-right:none !important; border-bottom:1px solid var(--line); }
  }
  .compose { padding:22px; border-right:1px solid var(--line); }
  .panel-title { font-size:13px; font-weight:600; color:var(--text-dim); margin:0 0 16px; }
  .compose textarea {
    width:100%; padding:11px 13px; resize:vertical; min-height:72px;
    background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:var(--radius); font-size:14px; transition:border-color .15s, box-shadow .15s;
  }
  .compose input, .compose select {
    width:100%; padding:11px 13px; background:var(--surface); color:var(--text);
    border:1px solid var(--line); border-radius:var(--radius); font-size:14px;
    transition:border-color .15s, box-shadow .15s;
  }
  .compose textarea:focus, .compose input:focus, .compose select:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(75,159,255,.15);
  }

  .feed { padding:22px 26px; min-width:0; }
  .feed-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .feed-head h2 { font-size:16px; font-weight:600; margin:0; }
  .count-pill {
    font-size:12px; color:var(--text-dim); background:var(--surface-2);
    border:1px solid var(--line); padding:3px 10px; border-radius:20px;
  }

  .incident {
    display:grid; grid-template-columns:4px 1fr auto; gap:0 16px; align-items:start;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 17px 15px 0; margin-bottom:11px; overflow:hidden;
    transition:border-color .25s, box-shadow .25s;
  }
  @keyframes flashin { from { background:var(--accent-dim); } to { background:var(--surface); } }
  .incident.flash { animation:flashin 1.1s ease-out; }
  /* Escalated state: amber accent so auto-escalated incidents stand out on the board. */
  .incident.escalated { border-color:var(--sev-high); box-shadow:inset 4px 0 0 var(--sev-high); }
  @keyframes flashin-esc { from { background:rgba(255,159,67,.22); } to { background:var(--surface); } }
  .incident.escalated.flash { animation:flashin-esc 1.1s ease-out; }
  .sev-bar { grid-row:1 / -1; align-self:stretch; width:4px; border-radius:4px 0 0 4px; }
  .inc-main { min-width:0; }
  .inc-title { font-size:15px; font-weight:600; margin:0 0 3px; }
  .inc-desc { font-size:13.5px; color:var(--text-dim); margin:0 0 9px; }
  .inc-meta { font-size:12px; color:var(--text-faint); display:flex; gap:14px; flex-wrap:wrap; }
  .inc-meta .sev-label { font-weight:600; }
  .inc-right { display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
  .esc-badge {
    font-size:11px; font-weight:700; letter-spacing:.03em;
    color:var(--sev-high);
    background:color-mix(in srgb, var(--sev-high) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--sev-high) 35%, transparent);
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .status-chip { font-size:12px; font-weight:600; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .btn-ack {
    font-size:12px; font-weight:600; white-space:nowrap;
    color:#06121f; background:var(--sev-high); border:none;
    padding:5px 12px; border-radius:6px; transition:filter .15s;
  }
  .btn-ack:hover { filter:brightness(1.08); }
  .btn-ack:disabled { opacity:.6; cursor:default; }
  .ack-label {
    font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
    color:var(--st-resolved);
    background:color-mix(in srgb, var(--st-resolved) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--st-resolved) 35%, transparent);
    padding:3px 9px; border-radius:20px;
  }
  .status-select {
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .status-select:focus { outline:none; border-color:var(--accent); }

  .empty { text-align:center; padding:70px 20px; color:var(--text-faint); }
  .empty-mark { width:36px; height:36px; border-radius:50%; border:2px dashed var(--line); margin:0 auto 16px; }
  .empty h3 { color:var(--text-dim); font-weight:600; font-size:15px; margin:0 0 6px; }
  .empty p { margin:0; font-size:13.5px; }

  .toast {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:11px 18px; border-radius:8px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<section id="login-view">
  <div class="login-card">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">OpsPulse</span></div>
    <p class="login-sub">Sign in to your operations command center.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" value="admin@acme.com" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" value="admin123" autocomplete="current-password" />
    </div>
    <button id="login-btn" class="btn-primary">Sign in</button>
    <div id="login-error" class="login-error"></div>
  </div>
</section>

<section id="app-view">
  <div class="topbar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">OpsPulse</span></div>
    <div class="topbar-right">
      <span id="live" class="live-dot"><span class="dot"></span><span id="live-label">connecting…</span></span>
      <div class="who">
        <div class="who-name" id="who-name">—</div>
        <div class="who-tenant" id="who-tenant">—</div>
      </div>
      <button id="logout-btn" class="btn-ghost">Sign out</button>
    </div>
  </div>

  <div class="layout">
    <aside class="compose">
      <h3 class="panel-title">Log a field event</h3>
      <div class="field">
        <label for="c-title">What happened</label>
        <input id="c-title" placeholder="Freight delayed at Lahore port" />
      </div>
      <div class="field">
        <label for="c-desc">Details</label>
        <textarea id="c-desc" placeholder="Container held in customs, ~6 hour delay expected"></textarea>
      </div>
      <div class="field">
        <label for="c-sev">Severity</label>
        <select id="c-sev">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH" selected>High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
      <button id="create-btn" class="btn-primary">Log event</button>
      <div id="create-error" class="form-error"></div>
    </aside>

    <main class="feed">
      <div class="feed-head">
        <h2>Live activity</h2>
        <span class="count-pill" id="count-pill">0 events</span>
      </div>
      <div id="feed-list"></div>
    </main>
  </div>
</section>

<div id="toast" class="toast"></div>

<script>
  const API = "http://localhost:9090";
  let token = null;
  let tenantId = null;
  let incidents = [];
  let stompClient = null;

  const loginView  = document.getElementById("login-view");
  const appView    = document.getElementById("app-view");
  const loginBtn   = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");

  function authHeaders(extra = {}) { return { "Authorization": "Bearer " + token, ...extra }; }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function decodeToken(tok) {
    try {
      const payload = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(payload));
    } catch { return {}; }
  }

  const SEV = {
    CRITICAL:{label:"Critical",color:"var(--sev-critical)"},
    HIGH:{label:"High",color:"var(--sev-high)"},
    MEDIUM:{label:"Medium",color:"var(--sev-medium)"},
    LOW:{label:"Low",color:"var(--sev-low)"},
  };
  const STATUS = {
    OPEN:{label:"Open",color:"var(--st-open)"},
    IN_PROGRESS:{label:"In progress",color:"var(--st-progress)"},
    RESOLVED:{label:"Resolved",color:"var(--st-resolved)"},
  };
  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    loginError.textContent = "";
    loginBtn.disabled = true; loginBtn.textContent = "Signing in…";
    try {
      const res = await fetch(API + "/api/auth/login", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) { loginError.textContent = "That email and password didn't match. Try again."; return; }
      const data = await res.json();
      token = data.token;
      const claims = decodeToken(token);
      tenantId = claims.tenantId;
      document.getElementById("who-name").textContent = email;
      document.getElementById("who-tenant").textContent = "Tenant " + (tenantId ? tenantId.slice(0,8) : "");
      loginView.style.display = "none";
      appView.style.display = "flex";
      await loadIncidents();
      connectWebSocket();
    } catch (e) {
      loginError.textContent = "Can't reach the server. Is OpsPulse running on :9090?";
    } finally {
      loginBtn.disabled = false; loginBtn.textContent = "Sign in";
    }
  }

  async function loadIncidents() {
    try {
      const res = await fetch(API + "/api/incidents", { headers: authHeaders() });
      if (!res.ok) { toast("Couldn't load events (" + res.status + ")"); return; }
      incidents = await res.json();
      render();
    } catch { toast("Can't reach the server."); }
  }

  function connectWebSocket() {
    const sock = new SockJS(API + "/ws");
    stompClient = Stomp.over(sock);
    stompClient.debug = null;
    stompClient.connect({}, () => {
      setLive(true);
      stompClient.subscribe("/topic/incident/" + tenantId, (message) => {
        const incoming = JSON.parse(message.body);
        mergeIncident(incoming);
      });
    }, () => {
      setLive(false);
      setTimeout(connectWebSocket, 3000);
    });
  }

  function setLive(on) {
    const el = document.getElementById("live");
    el.classList.toggle("on", on);
    document.getElementById("live-label").textContent = on ? "live" : "offline";
  }

  function mergeIncident(incoming) {
    const idx = incidents.findIndex(i => i.id === incoming.id);
    if (idx >= 0) incidents[idx] = incoming;
    else incidents.push(incoming);
    render(incoming.id);
  }

  function render(flashId) {
    const list = document.getElementById("feed-list");
    document.getElementById("count-pill").textContent =
      incidents.length + (incidents.length === 1 ? " event" : " events");

    if (incidents.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-mark"></div>
          <h3>No active events</h3>
          <p>When your team logs a field event, it shows up here — live.</p>
        </div>`;
      return;
    }

    const sorted = [...incidents].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    list.innerHTML = sorted.map(inc => {
      const sev = SEV[inc.severity] || { label: inc.severity, color: "var(--text-dim)" };
      const st  = STATUS[inc.status] || { label: inc.status, color: "var(--text-dim)" };
      const flash = inc.id === flashId ? " flash" : "";
      const escalated = inc.escalationLevel > 0;
      const acknowledged = inc.acknowledgedAt != null;
      return `
        <div class="incident${flash}${escalated ? " escalated" : ""}">
          <span class="sev-bar" style="background:${sev.color}"></span>
          <div class="inc-main">
            <p class="inc-title">${escapeHtml(inc.title)}</p>
            ${inc.description ? `<p class="inc-desc">${escapeHtml(inc.description)}</p>` : ""}
            <div class="inc-meta">
              <span class="sev-label" style="color:${sev.color}">${sev.label}</span>
              <span>${escapeHtml(inc.createdByName || "")}</span>
              <span>${fmtTime(inc.createdAt)}</span>
            </div>
          </div>
          <div class="inc-right">
            ${escalated ? `<span class="esc-badge">⬆ ESCALATED · L${inc.escalationLevel}</span>` : ""}
            ${acknowledged
              ? `<span class="ack-label">✓ Acknowledged</span>`
              : (escalated ? `<button class="btn-ack" data-id="${inc.id}">Acknowledge</button>` : "")}
            <span class="status-chip" style="color:${st.color};background:color-mix(in srgb, ${st.color} 14%, transparent)">${st.label}</span>
            <select class="status-select" data-id="${inc.id}">
              <option value="OPEN"        ${inc.status==="OPEN"?"selected":""}>Open</option>
              <option value="IN_PROGRESS" ${inc.status==="IN_PROGRESS"?"selected":""}>In progress</option>
              <option value="RESOLVED"    ${inc.status==="RESOLVED"?"selected":""}>Resolved</option>
            </select>
          </div>
        </div>`;
    }).join("");

    list.querySelectorAll(".status-select").forEach(sel => {
      sel.addEventListener("change", () => updateStatus(sel.dataset.id, sel.value));
    });

    list.querySelectorAll(".btn-ack").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.disabled = true; btn.textContent = "Acknowledging…";
        acknowledge(btn.dataset.id);
      });
    });
  }

  async function createIncident() {
    const title = document.getElementById("c-title").value.trim();
    const description = document.getElementById("c-desc").value.trim();
    const severity = document.getElementById("c-sev").value;
    const err = document.getElementById("create-error");
    err.textContent = "";
    if (!title) { err.textContent = "Give the event a title."; return; }
    try {
      const res = await fetch(API + "/api/incidents", {
        method:"POST", headers: authHeaders({ "Content-Type":"application/json" }),
        body: JSON.stringify({ title, description, severity }),
      });
      if (!res.ok) { err.textContent = "Couldn't log the event (" + res.status + ")."; return; }
      // The feed updates via the WebSocket broadcast (so every open window updates together).
      document.getElementById("c-title").value = "";
      document.getElementById("c-desc").value = "";
      toast("Event logged");
    } catch { err.textContent = "Can't reach the server."; }
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(API + "/api/incidents/" + id, {
        method:"PATCH", headers: authHeaders({ "Content-Type":"application/json" }),
        body: JSON.stringify({ status }),
      });
      if (!res.ok) { toast("Couldn't update (" + res.status + ")"); return; }
    } catch { toast("Can't reach the server."); }
  }

  async function acknowledge(id) {
    try {
      const res = await fetch(API + "/api/incidents/" + id + "/ack", {
        method:"PATCH", headers: authHeaders(),
      });
      if (!res.ok) { toast("Couldn't acknowledge (" + res.status + ")"); render(); return; }
      // The card updates live via the WebSocket broadcast — button flips to "✓ Acknowledged".
      toast("Incident acknowledged");
    } catch { toast("Can't reach the server."); render(); }
  }

  function logout() {
    if (stompClient) { try { stompClient.disconnect(); } catch {} stompClient = null; }
    token = null; tenantId = null; incidents = [];
    setLive(false);
    appView.style.display = "none";
    loginView.style.display = "flex";
  }

  loginBtn.addEventListener("click", login);
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  document.getElementById("create-btn").addEventListener("click", createIncident);
  document.getElementById("logout-btn").addEventListener("click", logout);
</script>
</body>
</html>
